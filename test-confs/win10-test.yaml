# Windows 10 Test Configuration
# Tests VMCraft capabilities on Windows 10 VMDK

cmd: local

# Source VMDK (split/sparse format)
vmdk: /home/ssahani/tt/hyper2kvm/win10/win10.vmdk

# Output Configuration
output_dir: /home/ssahani/tt/hyper2kvm/out/win10-test
to_output: /home/ssahani/tt/hyper2kvm/out/win10-test/win10-converted.qcow2
out_format: qcow2
compress: true

# Working Directory
