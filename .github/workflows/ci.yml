name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,test]

    - name: Run linters
      run: |
        ruff check . || true
        ruff format --check . || true

    - name: Run tests
      run: |
        pytest tests/ -v --cov=hyper2kvm --cov-report=xml --cov-report=term

    - name: Upload coverage
      uses: codecov/codecov-action@v5
      if: matrix.python-version == '3.12'
      with:
        file: ./coverage.xml

  test-worker-protocol:
    name: Test Worker Protocol
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install -e .[dev,test]

    - name: Run Worker Protocol tests
      run: |
        pytest tests/test_worker_protocol.py -v

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build worker image
      uses: docker/build-push-action@v6
      with:
        context: .
        target: worker
        tags: hyper2kvm:worker
        cache-from: type=gha
        cache-to: type=gha,mode=max
        outputs: type=docker,dest=/tmp/worker.tar

    - name: Upload worker image artifact
      uses: actions/upload-artifact@v6
      with:
        name: docker-worker
        path: /tmp/worker.tar
        retention-days: 1

  helm-lint:
    name: Lint Helm Chart
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: '3.14.0'

    - name: Lint Helm chart
      run: |
        helm lint helm/hyper2kvm-worker

    - name: Template Helm chart
      run: |
        helm template test-release helm/hyper2kvm-worker \
          --namespace test \
          --values helm/hyper2kvm-worker/values.yaml \
          > /tmp/manifests.yaml

  integration-test:
    name: Integration Test (k3d)
    runs-on: ubuntu-latest
    needs: [build-docker, helm-lint]

    steps:
    - uses: actions/checkout@v6

    - name: Download worker image
      uses: actions/download-artifact@v7
      with:
        name: docker-worker
        path: /tmp

    - name: Load Docker image
      run: |
        docker load --input /tmp/worker.tar

    - name: Set up k3d
      uses: AbsaOSS/k3d-action@v2
      with:
        cluster-name: "test-cluster"
        args: >-
          --agents 2
          --wait

    - name: Import image to k3d
      run: |
        k3d image import hyper2kvm:worker -c test-cluster

    - name: Set up Helm
      uses: azure/setup-helm@v4

    - name: Deploy with Helm
      run: |
        helm install test-release helm/hyper2kvm-worker \
          --namespace hyper2kvm-workers \
          --create-namespace \
          --set worker.nodeSelector=null \
          --set storage.state.enabled=false \
          --set storage.events.enabled=false \
          --set storage.input.enabled=false \
          --set storage.output.enabled=false \
          --set storage.temp.enabled=false \
          --set initContainer.enabled=false \
          --set monitoring.serviceMonitor.enabled=false \
          --wait \
          --timeout 5m

    - name: Verify deployment
      run: |
        kubectl get pods -n hyper2kvm-workers
        kubectl wait --for=condition=Ready pods -l app=hyper2kvm-worker \
          -n hyper2kvm-workers \
          --timeout=300s || true

    - name: Show logs on failure
      if: failure()
      run: |
        kubectl logs -n hyper2kvm-workers -l app=hyper2kvm-worker --tail=100

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-docker

    steps:
    - uses: actions/checkout@v6

    - name: Download worker image
      uses: actions/download-artifact@v7
      with:
        name: docker-worker
        path: /tmp

    - name: Load Docker image
      run: |
        docker load --input /tmp/worker.tar

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'hyper2kvm:worker'
        format: 'table'
        exit-code: '0'
        severity: 'CRITICAL,HIGH'
